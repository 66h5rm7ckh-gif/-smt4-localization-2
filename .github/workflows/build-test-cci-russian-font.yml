name: Build SMT IV test CCI with Russian font

on:
  push:
    paths:
      - ".github/workflows/build-test-cci-russian-font.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the original English CCI"
        required: true
        default: "v0.1"
        type: string
permissions:
  contents: read
  actions: read

jobs:
  build-cci:
    name: Build test CCI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download original CCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p work/input
          gh release download "${{ inputs.release_tag || 'v0.1' }}" --repo "${{ github.repository }}" --pattern 'Shin.Megami.Tensei.IV.Eng.cci' --dir work/input
          test -s work/input/Shin.Megami.Tensei.IV.Eng.cci
          sha256sum work/input/Shin.Megami.Tensei.IV.Eng.cci

      - name: Prepare font build
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y python3-pip fonts-dejavu
          python3 -m pip install --upgrade pillow pypng
          git clone --depth 1 https://github.com/ObsidianX/3dstools.git work/3dstools
          mkdir -p work/font

      - name: Install 3DS tools
        run: |
          set -e
          mkdir -p .3dstool
          curl -L --fail --retry 3 -o .3dstool/3dstool.tar.gz https://github.com/dnasdw/3dstool/releases/download/v1.2.6/3dstool_linux_x86_64.tar.gz
          tar -xzf .3dstool/3dstool.tar.gz -C .3dstool
          TOOL="$(find .3dstool -type f -name 3dstool -print -quit)"
          test -n "$TOOL"
          if [ "$TOOL" != ".3dstool/3dstool" ]; then cp "$TOOL" .3dstool/3dstool; fi
          chmod +x .3dstool/3dstool
          .3dstool/3dstool --help | head -40

      - name: Extract original CCI
        run: |
          set -e
          chmod +x tools/extract_cci.sh
          tools/extract_cci.sh work/input/Shin.Megami.Tensei.IV.Eng.cci work/extracted "$PWD/.3dstool"

      - name: Build Russian font locally
        run: |
          set -e
          cp work/extracted/romfs/font/rodin_12_12.bcfnt work/font/rodin_12_12.bcfnt
          cd work/font
          python3 ../3dstools/bcfnt.py -x -y -f rodin_12_12.bcfnt
          cd ../..
          python3 - <<'PY'
          import json, math, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root=Path("work/font"); m=json.loads((root/"rodin_12_12_manifest.json").read_text())
          ti=m["textureInfo"]; gm=m["glyphMap"]; gw=m["glyphWidths"]
          ru="".join(dict.fromkeys("ЁАБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюяё"))
          aliases="ぁあぃいぅうぇえぉおかがきぎくぐけげこごさざしじすずせぜそぞただちぢっつづてでとどなにぬねのはばぱひびぴふぶぷへべぺほぼぽまみむめもゃやゅゆょよらりるれろゎわゐゑをん"
          alias=dict(zip(ru,aliases)); missing=[c for c in ru if c not in gm]
          cols,rows=ti["sheetInfo"]["cols"],ti["sheetInfo"]["rows"]; cw,ch=ti["glyph"]["width"],ti["glyph"]["height"]; sw,sh=ti["sheetInfo"]["width"],ti["sheetInfo"]["height"]; cap=cols*rows
          old=int(ti["sheetCount"]); new=old+math.ceil(len(missing)/cap); ti["sheetCount"]=new
          fp=next((x for x in ["/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf","/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf"] if Path(x).exists()),None)
          if not fp: raise SystemExit("No Cyrillic-capable TTF found")
          font=ImageFont.truetype(fp,size=max(8,ch-2)); maxidx=max(map(int,gw)) if gw else -1
          for n in range(old): shutil.copy2(root/f"rodin_12_12_sheet{n}.png",root/f"rodin_12_12_ru_sheet{n}.png")
          for sn in range(old,new):
            img=Image.new("RGBA",(sw,sh),(0,0,0,0)); draw=ImageDraw.Draw(img)
            for local in range(cap):
              n=(sn-old)*cap+local
              if n>=len(missing): continue
              c=missing[n]; idx=maxidx+1+n; gm[c]=idx; gm[alias[c]]=idx
              box=draw.textbbox((0,0),c,font=font); tw,th=box[2]-box[0],box[3]-box[1]
              x=(local%cols)*cw+max(0,(cw-tw)//2)-box[0]; y=(local//cols)*ch+max(0,(ch-th)//2)-box[1]
              draw.text((x,y),c,font=font,fill=(255,255,255,255)); gw[str(idx)]={"left":0,"glyph":min(cw,max(1,tw)),"char":min(cw,max(1,tw+1))}
            img.save(root/f"rodin_12_12_ru_sheet{sn}.png")
          m["glyphMap"]=gm; m["glyphWidths"]=gw
          (root/"rodin_12_12_ru_manifest.json").write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding="utf-8")
          print("added Russian glyphs:",len(missing),"new sheet count:",new)
          PY
          cd work/font
          python3 ../3dstools/bcfnt.py -c -y -f rodin_12_12_ru.bcfnt
          test -s rodin_12_12_ru.bcfnt
          ls -lh rodin_12_12_ru.bcfnt

      - name: Replace Russian font
        run: |
          set -e
          TARGET="$(find work/extracted/romfs -type f -name 'rodin_12_12.bcfnt' -print -quit)"
          test -n "$TARGET"
          cp work/font/rodin_12_12_ru.bcfnt "$TARGET"
          stat -c '%s bytes' "$TARGET"

      - name: Install MBM translator
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y mono-mcs
          git clone --depth 1 https://github.com/TraduSquare/Moonbeam.git work/Moonbeam
          cd work/Moonbeam/Moonbeam
          # Moonbeam uses C# tuple deconstruction, which the Ubuntu Mono compiler rejects.
          # Patch the two deconstruction foreach loops to plain tuple access before compiling.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("MBM.cs")
          s = p.read_text(encoding="utf-8-sig")
          s = s.replace("foreach (var (id, bytes) in lst)", "foreach (var item in lst)")
          s = s.replace("bw.Write(new byte[16 * (id - prevId - 1)]);", "bw.Write(new byte[16 * (item.id - prevId - 1)]);")
          s = s.replace("bw.Write(id);", "bw.Write(item.id);")
          s = s.replace("bw.Write(bytes.Length);", "bw.Write(item.bytes.Length);")
          s = s.replace("prevId = id;", "prevId = item.id;")
          s = s.replace("stringOffset += bytes.Length;", "stringOffset += item.bytes.Length;")
          s = s.replace("bw.Write(bytes);", "bw.Write(item.bytes);")
          p.write_text(s, encoding="utf-8")
          PY
          mcs -langversion:7 -out:Moonbeam.exe -r:System.Core.dll -r:System.Xml.dll -r:System.Xml.Linq.dll -r:System.Data.dll -r:System.Net.Http.dll MBM.cs Program.cs Properties/AssemblyInfo.cs
          test -s Moonbeam.exe
          cp Moonbeam.exe ../Moonbeam.exe
          cp dic.txt ../dic.txt
          ls -lh ../Moonbeam.exe ../dic.txt

      - name: Inject first Russian dialogue sample
        run: |
          set -e
          MBM="work/extracted/romfs/event/e001/e001.mbm"
          test -s "$MBM"
          mono work/Moonbeam/Moonbeam.exe -e "$MBM"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("work/extracted/romfs/event/e001/e001.mbm.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          replacements = {
              5: [("Who are you...?", "Кто ты...?"), ("State your name!", "Назови своё имя!")],
              7: [("Hahaha. He has spoken!", "Ха-ха-ха! Он заговорил!"), ("Your life is now irrevocably changed.", "Твоя жизнь отныне навсегда изменилась.")],
              8: [("The choices you make will no longer", "Твой выбор больше не будет"), ("bear only on you.", "касаться только тебя.")],
              9: [("What you do... will create a world...", "Твои поступки... создадут новый мир...")],
          }
          for entry in root.findall("entry"):
              eid = int(entry.attrib["id"])
              if eid not in replacements:
                  continue
              target = entry.find("target")
              text = target.text or ""
              for src, dst in replacements[eid]:
                  if src not in text:
                      raise SystemExit(f"Entry {eid}: source fragment not found: {src!r}")
                  text = text.replace(src, dst)
              target.text = text
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY
          cp work/Moonbeam/dic.txt work/Moonbeam/dic-russian.txt
          cat >> work/Moonbeam/dic-russian.txt <<'EOF'
          Аあ
          Бぃ
          Вい
          Гぅ
          Дう
          Еぇ
          Ёえ
          Жぉ
          Зお
          Иか
          Йが
          Кき
          Лぎ
          Мく
          Нぐ
          Оけ
          Пげ
          Рこ
          Сご
          Тさ
          Уざ
          Фし
          Хじ
          Цす
          Чず
          Шせ
          Щぜ
          Ъそ
          Ыぞ
          Ьた
          Эだ
          Юち
          Яぢ
          аっ
          бつ
          вづ
          гて
          дで
          еと
          жど
          зな
          иに
          йぬ
          кね
          лの
          мは
          нば
          оぱ
          пひ
          рび
          сぴ
          тふ
          уぶ
          фぷ
          хへ
          цべ
          чぺ
          шほ
          щぼ
          ъぽ
          ыま
          ьみ
          эむ
          юめ
          яも
          EOF
          cp work/Moonbeam/dic-russian.txt work/Moonbeam/dic.txt
          (cd work/Moonbeam && mono Moonbeam.exe -i "../../$MBM.xml")
          mv "$MBM.xml.mbm" "$MBM"

      - name: Apply sample Russian dialogue translations
        run: |
          set -e
          python3 - <<'PY'
          import json, re, struct
          from pathlib import Path

          ROOT=Path("work/extracted/romfs")
          ru="ЁАБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюяё"
          ru="".join(dict.fromkeys(ru))
          aliases="ぁあぃいぅうぇえぉおかがきぎくぐけげこごさざしじすずせぜそぞただちぢっつづてでとどなにぬねのはばぱひびぴふぶぷへべぺほぼぽまみむめもゃやゅゆょよらりるれろゎわゐゑをん"
          alias=dict(zip(ru,aliases))

          def sj(s): return s.encode("shift_jis")
          def enc(t):
            o=bytearray(); i=0
            while i<len(t):
              if i==0 and t.startswith("("):
                e=t.find(") ",i)
                if e>0:
                  o+=b"\xf0\x12"+sj("".join(alias.get(x,x) for x in t[1:e]))+b"\0\0"; i=e+2; continue
              if t.startswith("[END]",i): o+=b"\xff\xff"; i+=5; continue
              if t.startswith("[->]",i): o+=b"\xf0\x02"; i+=4; continue
              if t[i]=="\n": o+=b"\xf0\x01"; i+=1; continue
              if t[i]=="[":
                e=t.find("]",i); tag=t[i+1:e]; p=tag.split()
                if tag.startswith("Color:0x"):
                  o+=b"\xf0\x04"+struct.pack("<H",int(tag[8:],16))
                elif len(p)==2 and p[0] in {"11","41","42","51","52","53","54","55","56","57","58","70","71","72","73","74","75","77","78","79","7a","7b","7c","7d"}:
                  if p[0]=="7b":
                    a,b=[int(x.strip(",")) for x in p[1:]]; o+=b"\xf0\x7b"+struct.pack("<II",a,b)
                  elif p[0] in {"7c"}:
                    o+=b"\xf0"+bytes([int(p[0],16)])+struct.pack("<I",int(p[1]))
                  else:
                    o+=b"\xf0"+bytes([int(p[0],16)])+struct.pack("<H",int(p[1]))
                elif tag=="Flynn": o+=b"\xf0\x43\0\0"
                elif len(p)==2 and p[0]=="Ally": o+=b"\xf0\x43"+struct.pack("<H",int(p[1]))
                elif len(p)==2 and p[0] in {"Item","Skill","Amount","Demon","Demon name","Demon race"}:
                  mp={"Item":0x72,"Skill":0x77,"Amount":0x78,"Demon":0x73,"Demon name":0x73,"Demon race":0x75}
                  o+=b"\xf0"+bytes([mp[" ".join(p[:-1])]])+struct.pack("<H",int(p[-1]))
                else: raise ValueError("unsupported tag "+tag)
                i=e+1; continue
              ch=alias.get(t[i],t[i]); o+=sj(ch); i+=1
            return bytes(o)

          def patch(path,repl):
            d=path.read_bytes(); count=struct.unpack_from("<I",d,0x10)[0]; toff=struct.unpack_from("<I",d,0x14)[0]
            recs=[]
            for n in range(count):
              r=bytearray(d[toff+n*16:toff+n*16+16]); eid,ln,off=struct.unpack_from("<III",r,0)
              payload=d[off:off+ln] if ln and off else b""
              if eid in repl: payload=repl[eid]
              struct.pack_into("<I",r,4,len(payload)); recs.append((r,payload))
            out=bytearray(d[:toff]); table=bytearray(); blob=bytearray(); cur=toff+count*16
            for r,p in recs:
              if cur%4: blob+=b"\0"*(4-cur%4); cur+=4-cur%4
              struct.pack_into("<I",r,8,cur); table+=r; blob+=p; cur+=len(p)
            out+=table+blob; struct.pack_into("<I",out,0x0c,len(out)); path.write_bytes(out)

          grouped={}
          for line in Path("translation/ru_manifest.jsonl").read_text(encoding="utf-8").splitlines():
            if not line.strip(): continue
            x=json.loads(line)
            if x.get("status")=="translated": grouped.setdefault(x["file"],{})[int(x["id"])]=x["translation"]
          files=entries=0
          for txt,repl in grouped.items():
            p=ROOT/(txt[:-4]+".mbm")
            if not p.exists(): raise SystemExit(f"Missing MBM: {p}")
            patch(p,{k:enc(v) for k,v in repl.items()}); files+=1; entries+=len(repl)
          print(f"Translated MBM files: {files}; entries: {entries}")
          PY

      - name: Build RomFS
        run: |
          set -e
          .3dstool/3dstool -ctf romfs work/romfs-russian.bin --romfs-dir work/extracted/romfs
          test -s work/romfs-russian.bin

      - name: Build CXI
        run: |
          set -e
          CXI_ARGS=(
            -ctf cxi work/game-russian.cxi
            --header work/extracted/ncchheader.bin
            --exh work/extracted/exheader.bin
            --exefs work/extracted/exefs.bin
            --romfs work/romfs-russian.bin
            --plain work/extracted/plain.bin
            --not-encrypt
          )
          if [ -s work/extracted/logo.bin ]; then
            CXI_ARGS+=(--logo work/extracted/logo.bin)
          else
            echo "No logo region extracted; creating CXI without --logo."
          fi
          .3dstool/3dstool "${CXI_ARGS[@]}"
          test -s work/game-russian.cxi

      - name: Make emulator-ready decrypted CXI
        run: |
          set -e
          python3 - <<'PY'
          import hashlib, struct
          from pathlib import Path
          cxi=Path("work/game-russian.cxi")
          exheader=Path("work/extracted/exheader.bin").read_bytes()
          exefs=Path("work/extracted/exefs.bin").read_bytes()
          romfs=Path("work/romfs-russian.bin").read_bytes()
          b=bytearray(cxi.read_bytes())
          if b[0x100:0x104] != b"NCCH":
              raise SystemExit("Not an NCCH/CXI")
          # NCCH hash fields: ExHeader 0x160, ExeFS 0x1C0, RomFS 0x1E0.
          b[0x160:0x180]=hashlib.sha256(exheader).digest()
          b[0x1C0:0x1E0]=hashlib.sha256(exefs).digest()
          b[0x1E0:0x200]=hashlib.sha256(romfs).digest()
          # NoCrypto flag: NCCH flags byte 0x18F, bit 0x04.
          b[0x18F] |= 0x04
          cxi.write_bytes(b)
          print("NCCH magic:", b[0x100:0x104])
          print("NoCrypto flag:", hex(b[0x18F]))
          print("CXI size:", len(b))
          PY
          test -s work/game-russian.cxi

      - name: Rebuild CCI
        run: |
          set -e
          .3dstool/3dstool -ctf cci work/Shin.Megami.Tensei.IV.Russian.Test.cci --header work/extracted/ncsdheader.bin --partition0 work/game-russian.cxi
          test -s work/Shin.Megami.Tensei.IV.Russian.Test.cci
          stat -c '%s bytes' work/Shin.Megami.Tensei.IV.Russian.Test.cci
          sha256sum work/Shin.Megami.Tensei.IV.Russian.Test.cci | tee work/cci.sha256

      - name: Verify rebuilt CCI
        run: |
          set -e
          rm -rf work/verify && mkdir -p work/verify
          .3dstool/3dstool -xvt0f cci work/verify/game.cxi work/Shin.Megami.Tensei.IV.Russian.Test.cci --header work/verify/ncsdheader.bin
          CXI_VERIFY_ARGS=(
            -xvtf cxi work/verify/game.cxi
            --header work/verify/ncchheader.bin
            --exh work/verify/exheader.bin
            --exefs work/verify/exefs.bin
            --romfs work/verify/romfs.bin
            --plain work/verify/plain.bin
          )
          if [ -s work/verify/logo.bin ]; then
            CXI_VERIFY_ARGS+=(--logo work/verify/logo.bin)
          fi
          .3dstool/3dstool "${CXI_VERIFY_ARGS[@]}"
          .3dstool/3dstool -xvtf romfs work/verify/romfs.bin --romfs-dir work/verify/romfs
          VERIFIED="$(find work/verify/romfs -type f -name 'rodin_12_12.bcfnt' -print -quit)"
          test -n "$VERIFIED"
          cmp work/font/rodin_12_12_ru.bcfnt "$VERIFIED"
          echo "Verified rebuilt CCI contains the exact Russian font."
          sha256sum "$VERIFIED"

      - name: Upload emulator CCI only
        uses: actions/upload-artifact@v4
        with:
          name: smt4-russian-emulator-cci
          path: |
            work/Shin.Megami.Tensei.IV.Russian.Test.cci
            work/cci.sha256
          retention-days: 14
          compression-level: 6
