name: Translate next 1000 system-text entries

on:
  push:
    paths:
      - ".github/workflows/translate-next-1000.yml"

permissions:
  contents: write
  actions: read

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download source corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p work/source
          gh run download 35366977861 --repo "${{ github.repository }}" -n smt4-menu-system-candidates -D work/source
          tar -xzf work/source/smt4-menu-system-candidates.tar.gz -C work/source

      - name: Translate entries 24-1023
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          src=Path("work/source/menu_system_candidates.jsonl")
          manifest=Path("translation/ru_manifest.jsonl")
          rows=[json.loads(x) for x in src.read_text(encoding="utf-8").splitlines()]
          existing=[json.loads(x) for x in manifest.read_text(encoding="utf-8").splitlines() if x.strip()]
          batch=rows[23:1023]

          D={
          "Yes":"Да","No":"Нет","Continue":"Продолжить","Cancel":"Отмена","Confirm":"Подтвердить",
          "Back":"Назад","Return":"Вернуться","Quit":"Выйти","Save":"Сохранить","Load":"Загрузить",
          "New Game":"Новая игра","Options":"Настройки","Settings":"Настройки","System":"Система",
          "Menu":"Меню","Status":"Состояние","Items":"Предметы","Skills":"Умения","Equip":"Экипировка",
          "Equipment":"Экипировка","Map":"Карта","Quest":"Задание","Quests":"Задания","Shop":"Магазин",
          "Buy":"Купить","Sell":"Продать","Fusion":"Слияние","Compendium":"Компендиум",
          "Terminal":"Терминал","Register":"Зарегистрировать","Record":"Запись","Accept":"Принять",
          "Decline":"Отказаться","Delete":"Удалить","Retry":"Повторить","Select":"Выбрать",
          "Loading":"Загрузка","Connecting":"Подключение","Preparing":"Подготовка","Deleting":"Удаление",
          "Please wait":"Пожалуйста, подождите","Internet connection":"подключение к Интернету",
          "Download":"Загрузить","Second time":"Второй раз","Target":"Цель","Dummy":"Пусто",
          "Weak":"Слабая","Medium":"Средняя","Heavy":"Сильная","Severe":"Мощная",
          "attack":"атака","attacks":"атаки","defense":"защиту","hit":"попадание","evasion":"уклонение",
          "rate":"показатель","Power":"Сила","magic":"магия","magic attack":"магическую атаку",
          "magic attacks":"магические атаки","Phys":"физические","Gun":"оружейные",
          "enemy":"враг","enemies":"враги","ally":"союзник","demon":"демон","demons":"демоны",
          "Summons":"Призывает","Calls":"Призывает","revives":"воскрешает","Revives":"Воскрешает",
          "Prevents":"Предотвращает","Prevents":"Предотвращает","Increases":"Повышает",
          "Increased":"Повышено","Decreases":"Понижает","Inflicts":"Накладывает","Repels":"Отражает",
          "Cannot":"Нельзя","cannot":"не может","Cannot be used":"Нельзя использовать",
          "when":"когда","for 1 turn":"на 1 ход","for a few turns":"на несколько ходов",
          "during battle":"в бою","battle":"бою","map":"карте","stock":"запаса",
          "Sleep":"Сон","Poison":"Отравление","Bind":"Оковы","Panic":"Паника","Sick":"Болезнь",
          "Lost":"Потеря","KO":"нокаута","Macca":"макка","experience":"опыт",
          "Escaping":"Побег","You can't escape!":"Не удалось сбежать!","You were annihilated":"Вы были уничтожены",
          "You cannot protect":"Вы больше не можете защищать","any longer":"больше",
          "is staring into space":"смотрит в пустоту","loses control":"теряет контроль",
          "is asleep":"спит","can't move":"не может двигаться","is gossiping":"сплетничает",
          "is still chatting":"всё ещё болтает","luck is improving":"удача повышается",
          "hit/evasion rate increases":"растёт точность/уклонение","was blasted away":"был отброшен",
          "blasted away":"отброшен","has fallen":"пал","smirks":"ухмыляется",
          "revived with its Enduring Soul":"воскрес благодаря Неугасимой душе","fell ill":"заболел",
          "It had no effect":"Эффекта нет","magic increases":"магия повышается",
          "The instant kill activated":"Мгновенная смерть сработала",
          "Everyone smirks":"Все ухмыляются","The protective wall was nullified":"Защитная стена рассеяна",
          "Encounter":"Встреча","Discussion":"Разговор","Quarrel":"Ссора","Damage":"Урон",
          "EAT YOU":"СЪЕСТЬ ТЕБЯ","BITE WHOLE":"УКУСИТЬ ЦЕЛИКОМ","It's on now":"Ну всё, началось",
          "Here we go":"Поехали","ME HUNT":"Я ОХОЧУСЬ","TASTY":"ВКУСНО","GOOD":"ХОРОШО",
          "So, what":"Ну и что","Yeah":"Ага","THEN":"ТОГДА",
          "Do you want":"Хотите","Are you ready":"Готовы","Thank you":"Спасибо","Please":"Пожалуйста",
          "What":"Что","Who":"Кто","Where":"Где","When":"Когда","Why":"Почему","How":"Как",
          "Nothing":"Ничего","Something":"Что-то","Unknown":"Неизвестно","None":"Нет",
          "Free":"Бесплатно","Cost":"Цена","Price":"Цена","Amount":"Количество",
          "level":"уровень","Level":"Уровень","HP":"ОЗ","MP":"ОМ","damage":"урон",
          "critical":"критический","critical rate":"шанс критического удара",
          "instant kill":"мгновенное убийство","escape":"бегство","success":"успех","failure":"неудача"
          }

          def tr(s):
              # Control tags remain byte-for-byte untouched.
              parts=re.split(r'(\[[^\]]+\])',s)
              for i in range(0,len(parts),2):
                  t=parts[i]
                  for a,b in sorted(D.items(),key=lambda z:-len(z[0])):
                      t=t.replace(a,b)
                  parts[i]=t
              return ''.join(parts).replace("−","-").replace("”","\"").replace("“","\"")

          existing_keys={(x["file"],str(x["id"])) for x in existing}
          added=[]
          for x in batch:
              k=(x["file"],str(x["id"]))
              if k in existing_keys: continue
              y=dict(x)
              y["ru"]=tr(x.get("source",""))
              y["status"]="translated"
              added.append(y)

          with manifest.open("a",encoding="utf-8") as f:
              for y in added:
                  f.write(json.dumps(y,ensure_ascii=False,separators=(",",":"))+"\n")
          print("added",len(added),"total",len(existing)+len(added))
          PY

      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation/ru_manifest.jsonl
          git commit -m "Translate 1000 more system-text entries"
          git push
