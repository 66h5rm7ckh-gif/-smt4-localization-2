name: Match SMT IV Scripts

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Extract SMT IV CCI workflow run ID"
        required: true
        default: "35303156446"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  match:
    name: Match SMT IV MBM scripts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extracted RomFS
        uses: actions/download-artifact@v5
        with:
          name: smt4-romfs
          path: work/romfs
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone SMT IV script decoder
        run: |
          git clone --depth 1 \
            https://github.com/GilderBairn/SMTIV-script-decode.git \
            work/decoder

      - name: Inspect decoder
        run: |
          echo "=== Decoder structure ==="
          find work/decoder \
            -type f \
            | sort \
            | head -500

      - name: Find MBM files in ROM
        run: |
          mkdir -p work/report

          echo "=== MBM FILES IN OUR ROM ===" \
            > work/report/rom-mbm.txt

          find work/romfs \
            -type f \
            -iname '*.mbm' \
            -printf '%p\n' \
            | sed 's#^work/romfs/##' \
            | sort \
            >> work/report/rom-mbm.txt

      - name: Find TXT files in decoder
        run: |
          echo "=== TXT FILES IN DECODER ===" \
            > work/report/decoder-txt.txt

          find work/decoder \
            -type f \
            -iname '*.txt' \
            -printf '%p\n' \
            | sed 's#^work/decoder/##' \
            | sort \
            >> work/report/decoder-txt.txt

      - name: Match MBM paths
        run: |
          echo "=== PATH MATCHES ===" \
            > work/report/path-matches.txt

          while IFS= read -r mbm; do

            base="${mbm%.mbm}"

            candidate1="${base}.txt"
            candidate2="SMTIV/${base}.txt"

            if [ -f "work/decoder/$candidate1" ]; then
              echo "$mbm -> $candidate1"
              continue
            fi

            if [ -f "work/decoder/$candidate2" ]; then
              echo "$mbm -> $candidate2"
              continue
            fi

            filename=$(basename "$mbm" .mbm)

            found=$(find work/decoder \
              -type f \
              -iname "${filename}.txt" \
              | head -1)

            if [ -n "$found" ]; then
              echo "$mbm -> ${found#work/decoder/}"
            fi

          done < <(
            find work/romfs \
              -type f \
              -iname '*.mbm' \
              -printf '%p\n' \
              | sed 's#^work/romfs/##' \
              | sort
          ) \
          >> work/report/path-matches.txt

      - name: Match by filename
        run: |
          echo "=== FILENAME MATCHES ===" \
            > work/report/filename-matches.txt

          while IFS= read -r mbm; do

            filename=$(basename "$mbm" .mbm)

            find work/decoder \
              -type f \
              -iname "${filename}.txt" \
              -printf '%p\n' \
              | sed 's#^work/decoder/##' \
              | while IFS= read -r txt; do
                  echo "$mbm -> $txt"
                done

          done < <(
            find work/romfs \
              -type f \
              -iname '*.mbm' \
              -printf '%p\n' \
              | sed 's#^work/romfs/##' \
              | sort
          ) \
          | sort -u \
          >> work/report/filename-matches.txt

      - name: Search decoder documentation
        run: |
          echo "=== DECODER DOCUMENTATION ===" \
            > work/report/decoder-info.txt

          if [ -f work/decoder/README.md ]; then
            cat work/decoder/README.md \
              >> work/report/decoder-info.txt
          fi

      - name: Inspect MBM headers
        run: |
          echo "=== MBM HEADER ANALYSIS ===" \
            > work/report/mbm-headers.txt

          count=0

          while IFS= read -r mbm; do

            echo
            echo "FILE: $mbm"

            xxd -l 64 "work/romfs/$mbm" \
              2>/dev/null \
              || true

            count=$((count + 1))

            if [ "$count" -ge 100 ]; then
              break
            fi

          done < <(
            find work/romfs \
              -type f \
              -iname '*.mbm' \
              -printf '%p\n' \
              | sed 's#^work/romfs/##' \
              | sort
          ) \
          >> work/report/mbm-headers.txt

      - name: Generate summary
        run: |
          ROM_MBM=$(find work/romfs \
            -type f \
            -iname '*.mbm' \
            | wc -l)

          DECODER_TXT=$(find work/decoder \
            -type f \
            -iname '*.txt' \
            | wc -l)

          PATH_MATCH=$(grep -c -- ' -> ' \
            work/report/path-matches.txt \
            2>/dev/null || true)

          FILE_MATCH=$(grep -c -- ' -> ' \
            work/report/filename-matches.txt \
            2>/dev/null || true)

          {
            echo "================================="
            echo "SMT IV SCRIPT MATCHING"
            echo "================================="
            echo
            echo "MBM files in ROM: $ROM_MBM"
            echo "TXT files in decoder: $DECODER_TXT"
            echo
            echo "Path matches: $PATH_MATCH"
            echo "Filename matches: $FILE_MATCH"
            echo
            echo "================================="
            echo "IMPORTANT"
            echo "================================="
            echo
            echo "The matches are candidates."
            echo "They must be verified against actual MBM contents."
          } > work/report/summary.txt

          cat work/report/summary.txt

      - name: Package report
        if: always()
        run: |
          tar -czf \
            work/smt4-script-match-report.tar.gz \
            -C work/report .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smt4-script-match-report
          path: work/smt4-script-match-report.tar.gz
          retention-days: 14
          compression-level: 9