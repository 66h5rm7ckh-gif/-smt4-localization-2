name: Analyze and build Russian Rodin 12x12 font

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful ROMFS extraction run ID"
        required: true
        default: "35303156446"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download extracted ROMFS
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p work
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name smt4-romfs --dir work/romfs
          find work/romfs -type f | head

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip fonts-dejavu
          python3 -m pip install --upgrade pillow pypng
          git clone --depth 1 https://github.com/ObsidianX/3dstools.git work/3dstools

      - name: Extract and analyze rodin_12_12
        run: |
          mkdir -p work/font
          cp work/romfs/font/rodin_12_12.bcfnt work/font/
          cd work/font
          python3 ../3dstools/bcfnt.py -x -y -f rodin_12_12.bcfnt
          cd ../..
          python3 - <<'PY'
          import json, struct
          from pathlib import Path

          p = Path("work/font/rodin_12_12_manifest.json")
          m = json.loads(p.read_text())
          gm = m["glyphMap"]
          widths = m["glyphWidths"]
          ti = m["textureInfo"]

          lines = [
              "SMT IV RODIN 12x12 ANALYSIS",
              f"file=font/rodin_12_12.bcfnt",
              f"version={m['version']}",
              f"encoding={m['fontInfo']['encoding']}",
              f"font_height={m['fontInfo']['height']} font_width={m['fontInfo']['width']} ascent={m['fontInfo']['ascent']}",
              f"glyphs_in_cwdh={len(widths)}",
              f"glyph_map_entries={len(gm)}",
              f"sheet_count={ti['sheetCount']}",
              f"sheet_cols={ti['sheetInfo']['cols']} sheet_rows={ti['sheetInfo']['rows']}",
              f"sheet_size={ti['sheetInfo']['width']}x{ti['sheetInfo']['height']}",
              f"color_format={ti['sheetInfo']['colorFormat']}",
              "CMAP:",
          ]
          for ch, idx in sorted(gm.items(), key=lambda x: ord(x[0])):
              lines.append(f"U+{ord(ch):04X} {ch!r} -> glyph {idx}")
          lines += [
              "",
              "RUSSIAN:",
          ]
          ru = "ЁАБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюяё"
          lines.append("already_mapped=" + "".join(c for c in ru if c in gm))
          lines.append("missing=" + "".join(c for c in ru if c not in gm))
          Path("research").mkdir(exist_ok=True)
          Path("research/rodin_12_12-analysis.txt").write_text("\n".join(lines)+"\n", encoding="utf-8")
          PY

      - name: Build candidate Russian BCFNT
        run: |
          python3 - <<'PY'
          import json, math, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path("work/font")
          manifest_path = root / "rodin_12_12_manifest.json"
          m = json.loads(manifest_path.read_text())
          ti = m["textureInfo"]
          fi = m["fontInfo"]
          glyph_w = m["glyphWidths"]
          glyph_map = m["glyphMap"]

          ru = "ЁАБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюяё"
          ru = "".join(dict.fromkeys(ru))
          missing = [c for c in ru if c not in glyph_map]

          cols = ti["sheetInfo"]["cols"]
          rows = ti["sheetInfo"]["rows"]
          cell_w = ti["glyph"]["width"]
          cell_h = ti["glyph"]["height"]
          sheet_w = ti["sheetInfo"]["width"]
          sheet_h = ti["sheetInfo"]["height"]
          capacity = cols * rows
          max_idx = max(map(int, glyph_w)) if glyph_w else -1

          # Keep the original sheet(s) untouched; append enough sheets for new glyphs.
          old_count = int(ti["sheetCount"])
          new_count = old_count + math.ceil(len(missing) / capacity)
          ti["sheetCount"] = new_count

          font_candidates = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",
          ]
          font_path = next((x for x in font_candidates if Path(x).exists()), None)
          if not font_path:
              raise SystemExit("No Cyrillic-capable TTF found")

          size = max(8, cell_h - 2)
          font = ImageFont.truetype(font_path, size=size)

          # The packer derives sheet names from the output basename, so mirror
          # every original sheet under the new rodin_12_12_ru_* names first.
          for sheet_no in range(old_count):
              src = root / f"rodin_12_12_sheet{sheet_no}.png"
              dst = root / f"rodin_12_12_ru_sheet{sheet_no}.png"
              shutil.copy2(src, dst)

          # New glyph indices are appended after the original glyph table.
          # The new sheets start at local position 0; they must NOT be addressed
          # using the absolute sheet number because the original glyph table is
          # not necessarily a full multiple of sheet capacity.
          for sheet_no in range(old_count, new_count):
              img = Image.new("RGBA", (sheet_w, sheet_h), (0,0,0,0))
              draw = ImageDraw.Draw(img)
              for local in range(capacity):
                  n = (sheet_no - old_count) * capacity + local
                  if n >= len(missing):
                      continue
                  ch = missing[n]
                  idx = max_idx + 1 + n
                  glyph_map[ch] = idx
                  box = draw.textbbox((0,0), ch, font=font)
                  tw, th = box[2]-box[0], box[3]-box[1]
                  x = (local % cols) * cell_w + max(0, (cell_w-tw)//2) - box[0]
                  y = (local // cols) * cell_h + max(0, (cell_h-th)//2) - box[1]
                  draw.text((x,y), ch, font=font, fill=(255,255,255,255))
                  glyph_w[str(idx)] = {"left": 0, "glyph": min(cell_w, max(1, tw)), "char": min(cell_w, max(1, tw+1))}
              img.save(root / f"rodin_12_12_sheet{sheet_no}.png")

          # If no missing glyphs, preserve original manifest/sheets.
          m["glyphMap"] = glyph_map
          m["glyphWidths"] = glyph_w
          # 3dstools derives the output manifest name from the output BCFNT name.
          out_manifest = root / "rodin_12_12_ru_manifest.json"
          out_manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2), encoding="utf-8")

          print(f"original glyphs: {max_idx+1}")
          print(f"added Russian glyphs: {len(missing)}")
          print(f"new sheet count: {new_count}")
          PY

          cd work/font
          python3 ../3dstools/bcfnt.py -c -y -f rodin_12_12_ru.bcfnt

      - name: Validate candidate
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          p = Path("work/font/rodin_12_12_ru.bcfnt")
          d = p.read_bytes()
          assert d[:4] == b"CFNT", "bad CFNT magic"
          assert len(d) == struct.unpack_from("<I", d, 0x0C)[0], "bad file size"

          finf = 0x14
          assert d[finf:finf+4] == b"FINF"
          cmap = struct.unpack_from("<I", d, finf+0x18)[0] - 8
          assert d[cmap:cmap+4] == b"CMAP"

          text = Path("research/rodin_12_12-analysis.txt").read_text(encoding="utf-8")
          assert "missing=" in text
          print("Candidate BCFNT is structurally valid.")
          print(f"size={len(d)} bytes")
          print(f"CMAP at 0x{cmap:X}")
          PY

      - name: Upload font build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smt4-rodin-12-12-russian-font
          path: |
            research/rodin_12_12-analysis.txt
            work/font/rodin_12_12_manifest.json
            work/font/rodin_12_12_ru_manifest.json
            work/font/rodin_12_12_sheet*.png
            work/font/rodin_12_12_ru.bcfnt
          retention-days: 14
