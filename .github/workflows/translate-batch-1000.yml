name: Translate batch 1024-2023

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/source
          gh run download 35366977861 --repo "${{ github.repository }}" -n smt4-menu-system-candidates -D work/source
          tar -xzf work/source/smt4-menu-system-candidates.tar.gz -C work/source
      - name: Translate and insert next 1000
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.parse,urllib.request
          from pathlib import Path

          all_rows=[json.loads(x) for x in Path("work/source/menu_system_candidates.jsonl").read_text(encoding="utf8").splitlines()]
          rows=all_rows[1023:2023]
          out=Path("translation/ru_manifest.jsonl")
          existing=[json.loads(x) for x in out.read_text(encoding="utf8").splitlines() if x.strip()]
          keys={(x["file"],str(x["id"])) for x in existing}

          exact={
            "Dummy":"Пусто","Yes":"Да","No":"Нет","Continue":"Продолжить","Cancel":"Отмена","Confirm":"Подтвердить",
            "Back":"Назад","Return":"Вернуться","Quit":"Выйти","Save":"Сохранить","Load":"Загрузить",
            "New Game":"Новая игра","Options":"Настройки","Settings":"Настройки","System":"Система","Menu":"Меню",
            "Status":"Состояние","Items":"Предметы","Skills":"Умения","Equip":"Экипировка","Equipment":"Экипировка",
            "Map":"Карта","Quest":"Задание","Quests":"Задания","Shop":"Магазин","Buy":"Купить","Sell":"Продать",
            "Fusion":"Слияние","Compendium":"Компендиум","Terminal":"Терминал","Register":"Зарегистрировать",
            "Record":"Запись","Accept":"Принять","Decline":"Отказаться","Delete":"Удалить","Retry":"Повторить","Select":"Выбрать",
            "Weak":"Слабая","Medium":"Средняя","Heavy":"Сильная","Severe":"Мощная","Target:":"Цель:","Effect:":"Эффект:",
            "Macca":"макка","HP":"ОЗ","MP":"ОМ","Power":"Сила","Sleep":"Сон","Poison":"Отравление","Bind":"Оковы",
            "Panic":"Паника","Sick":"Болезнь","KO":"нокаут","Damage":"Урон","Encounter":"Встреча","Discussion":"Разговор",
            "Quarrel":"Ссора","StreetPass":"StreetPass","Phys":"Физ.","Gun":"Огнестрел","Fire":"Огонь","Ice":"Лёд",
            "Elec":"Электричество","Force":"Сила","Light":"Свет","Dark":"Тьма","Self":"Себя","Resistance":"Сопротивление",
            "Resist":"Сопротивление","Null":"Отмена урона","Repel":"Отражение","Drain":"Поглощение"
          }

          glossary={
            "Macca":"макка","Mikado":"Микадо","Eastern Kingdom of Mikado":"Восточное королевство Микадо",
            "Hunter Association":"Ассоциация охотников","K's Tavern":"таверна К","Burroughs":"Бурроуз",
            "Compendium":"Компендиум","Press Turn":"Press Turn","Press Turn Icon":"значок Press Turn",
            "Luxuror":"люксор","Casualry":"казуалри","Flynn":"Флинн","Jonathan":"Джонатан","Isabeau":"Изабо",
            "Walter":"Уолтер","Yuriko":"Юрико","Tokyo":"Токио","Styx":"Стикс","Charon":"Харон"
          }

          def protect(s):
            saved=[]
            def h(m):
              saved.append(m.group(0)); return f"§TAG{len(saved)-1}§"
            t=re.sub(r'\[[^\]]+\]',h,s)
            return t,saved

          def restore(t,saved):
            for i,v in enumerate(saved): t=t.replace(f"§TAG{i}§",v)
            return t

          def google_translate(text):
            if not text.strip(): return text
            t,saved=protect(text)
            # Protect established game terms and control placeholders from machine translation.
            protected=[]
            terms=sorted(glossary,key=len,reverse=True)
            for term in terms:
              if term in t:
                marker=f"§TERM{len(protected)}§"
                protected.append(glossary[term])
                t=t.replace(term,marker)
            q=urllib.parse.quote(t)
            url="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q="+q
            try:
              with urllib.request.urlopen(url,timeout=20) as r:
                data=json.loads(r.read().decode("utf8"))
              translated="".join(x[0] for x in data[0] if x and x[0])
            except Exception:
              translated=t
            for i,v in enumerate(protected): translated=translated.replace(f"§TERM{i}§",v)
            translated=restore(translated,saved)
            translated=translated.replace("— —","—").replace("  "," ")
            return translated

          def translate_skill(s):
            t,saved=protect(s)
            t=t.replace("−","-")
            replacements=[
              (r'(?i)(\d+[–-]\d+|\d+)\s+weak\s+([§\w\d]+)\s+attacks?',r'\1 слаб. атак'),
              (r'(?i)heavy\s+([^\n]+?)\s+attack',r'Сильная \1 атака'),
              (r'(?i)weak\s+([^\n]+?)\s+attack',r'Слабая \1 атака'),
              (r'(?i)medium\s+([^\n]+?)\s+attack',r'Средняя \1 атака'),
              (r'(?i)severe\s+([^\n]+?)\s+attack',r'Мощная \1 атака'),
            ]
            for a,b in replacements: t=re.sub(a,b,t)
            for a,b in [
              ("Target:","Цель:"),("Target: Self","Цель: себя"),("Inflicts Poison","Накладывает Отравление"),
              ("Inflicts Panic","Накладывает Панику"),("Inflicts Sleep","Накладывает Сон"),
              ("Inflicts Bind","Накладывает Оковы"),("Inflicts Sick","Накладывает Болезнь"),
              ("Pierce effect","Пробивает сопротивление"),("Removes Tetrakarn effect","Снимает эффект Тетракарна"),
              ("Removes Makarakarn effect","Снимает эффект Макарокарна"),("Drains Phys attacks","Поглощает физический урон"),
              ("Drains Gun attacks","Поглощает урон от огнестрела"),("Drains Fire attacks","Поглощает урон от огня"),
              ("Drains Ice attacks","Поглощает урон от льда"),("Drains Elec attacks","Поглощает урон от электричества"),
              ("Drains Force attacks","Поглощает урон от Силы"),("Nulls Phys attacks","Обнуляет физический урон"),
              ("Nulls Gun attacks","Обнуляет урон от огнестрела"),("Nulls Fire attacks","Обнуляет урон от огня"),
              ("Nulls Ice attacks","Обнуляет урон от льда"),("Nulls Elec attacks","Обнуляет урон от электричества"),
              ("Nulls Force attacks","Обнуляет урон от Силы"),("Repels Phys attacks","Отражает физический урон"),
              ("Repels Gun attacks","Отражает урон от огнестрела"),("Repels Fire attacks","Отражает урон от огня"),
              ("Repels Ice attacks","Отражает урон от льда"),("Repels Elec attacks","Отражает урон от электричества"),
              ("Repels Force attacks","Отражает урон от Силы"),("Increases resistance to","Повышает сопротивление"),
              ("Strengthens","Усиливает"),("Greatly strengthens","Сильно усиливает"),("Revive from KO","Воскрешает после нокаута"),
              ("after a battle","после боя"),("after walking a certain distance","после определённого расстояния"),
              ("Inactive when in the stock.","Не действует, пока демон находится в запасе."),
              ("Obtain more EXP after battles","Получает больше опыта после боёв"),
              ("Obtain much more EXP after battles","Получает значительно больше опыта после боёв"),
              ("Increases hit/evade rate","Повышает точность/уклонение"),
              ("Greatly increases hit/evade rate","Сильно повышает точность/уклонение"),
              ("Increases critical hit rate","Повышает шанс критического удара"),
              ("Target:","Цель:"),("HP","ОЗ"),("MP","ОМ")
            ]: t=t.replace(a,b)
            return restore(t,saved)

          cache={}
          def tr(s):
            if s in exact: return exact[s]+"\n[END]" if s.endswith("\n[END]") else exact[s]
            if s in cache: return cache[s]
            if "Dummy" in s and s.strip().startswith("Dummy"): return s.replace("Dummy","Пусто")
            if "[7d " in s and ("attack" in s.lower() or "target:" in s.lower() or "resistance" in s.lower()):
              r=translate_skill(s)
            else:
              r=google_translate(s)
            # Consistent glossary after translation.
            for en,ru in sorted(glossary.items(),key=lambda z:-len(z[0])):
              r=r.replace(en,ru)
            cache[s]=r
            time.sleep(0.08)
            return r

          added=0
          for x in rows:
            k=(x["file"],str(x["id"]))
            if k in keys: continue
            y=dict(x)
            y["ru"]=tr(x.get("source",""))
            y["status"]="translated"
            with out.open("a",encoding="utf8") as f:
              f.write(json.dumps(y,ensure_ascii=False,separators=(",",":"))+"\n")
            keys.add(k); added+=1
          print("INSERTED",added,"FILE_LINES",len(existing)+added,"REMAINING",26211-(len(existing)+added))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation/ru_manifest.jsonl
          git commit -m "Translate and insert SMT IV entries 1024-2023"
          git push
